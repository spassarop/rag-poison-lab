services:
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_NOFILE=65535
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "</dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_PATH=http://chroma:8000
      # Judge PANEL: distinct model families for independent opinions (a single model at
      # temperature 0 just repeats itself). Pull them first: `ollama pull gemma2:2b`
      # (llama3.1 / qwen2.5 you likely already have). Empty → single JUDGE_MODEL.
      - JUDGE_MODELS=${JUDGE_MODELS:-llama3.1:8b-instruct-q4_K_M,qwen2.5:7b,gemma2:2b}
      # Demo control panel (DEMO ONLY). Off by default; enable for the recording panel:
      #   ENABLE_ADMIN=1 docker compose up -d api   → panel at http://localhost:8000/ui/
      - ENABLE_ADMIN=${ENABLE_ADMIN:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chroma:
        condition: service_healthy
    volumes:
      - ./corpus:/app/corpus:ro
      - ./attacks:/app/attacks:ro
      # UI is bind-mounted (not baked) so you can tweak the panel and just refresh.
      - ./ui:/app/ui:ro

volumes:
  chroma_data:
    name: rag_poison_chroma_data

# Optional profile: Run Ollama in container (reusing host models)
# Activate with: docker compose --profile ollama up
#
# Uncomment below if you want to containerize Ollama:

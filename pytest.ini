[pytest]
addopts = --tb=short --no-header
testpaths = tests
markers =
    l1: end-to-end canary invariant (deterministic, unconditional user-facing check)
    l2: parametrized GCR security gate over the attack corpus (RSR is reported by the scripts)
    l3: semantic LLM-as-judge evaluation (non-blocking; run as a separate job)
